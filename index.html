<!DOCTYPE html>
<html lang="ko" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JangSW Portfolio</title>
    
    <!-- SEO & Social Preview (Open Graph) -->
    <meta name="description" content="JangSW - Software Engineer Portfolio">
    <meta property="og:title" content="JangSW Portfolio">
    <meta property="og:description" content="탐구하며 배우고 기록하는, 장석우의 포트폴리오입니다.">
    <meta property="og:image" content="https://jangsw.com/data/favi.png">
    <meta property="og:url" content="https://jangsw.com">
    <meta property="og:type" content="website">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="JangSW Portfolio">
    <meta name="twitter:description" content="탐구하며 배우고 기록하는, 장석우의 포트폴리오입니다.">
    <meta name="twitter:image" content="https://jangsw.com/data/favi.png">

    <!-- Favicon & Icons -->
    <link rel="icon" href="data/favi.png" type="image/png">
    <link rel="apple-touch-icon" href="data/favi.png">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Highlight.js (Code Syntax Highlighting) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
</head>

<body>

    <!-- Mobile Header -->
    <div class="header-mobile">
        <h1>JangSW Portfolio</h1>
        <button id="theme-toggle-mobile"
            style="background:none; border:none; color:var(--text-color); font-size:1.2rem; cursor:pointer;">
            <i class="fas fa-sun"></i>
        </button>
    </div>

    <div class="layout-container">

        <!-- Left Sidebar -->
        <nav class="sidebar">
            <a href="#/" class="logo">
                <span class="logo-text">JangSW</span>
            </a>

            <ul class="nav-links">
                <li><a href="#/"><i class="fas fa-home"></i><span>홈</span></a></li>
                <li><a href="#/about"><i class="fas fa-user"></i><span>소개</span></a></li>
                <li><a href="#/specs"><i class="fas fa-briefcase"></i><span>스펙</span></a></li>
                <li><a href="#/blog"><i class="fas fa-book"></i><span>블로그</span></a></li>
                <li><a href="#/contact"><i class="fas fa-envelope"></i><span>연락처</span></a></li>

                <li id="sidebar-github-wrapper" style="display: none;">
                    <a href="#" id="sidebar-github" target="_blank">
                        <i class="fab fa-github"></i><span>깃허브</span>
                    </a>
                </li>

                <li>
                    <a href="#" id="theme-toggle">
                        <i class="fas fa-sun"></i><span>테마 변경</span>
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Center Feed -->
        <main class="main-feed" id="feed-content">
            <!-- Content will be injected here via JavaScript Hash Routing -->
            <div
                style="display:flex; justify-content:center; align-items:center; height:100%; color: var(--text-muted);">
                <i class="fas fa-spinner fa-spin" style="font-size: 2rem;"></i>
            </div>
        </main>

        <!-- Right Profile Panel -->
        <aside class="profile-panel">
            <div class="profile-card">
                <div class="profile-img-wrapper" id="profile-img-container"
                    style="background:transparent; padding: 4px; border: 2px solid var(--accent-color);">
                    <img src="data/face.jpg" alt="Profile"
                        style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: center; display: block;">
                </div>

                <div>
                    <div class="profile-name" id="profile-name">Developer</div>
                    <div class="profile-major" id="profile-major">Software Engineering | ISTP</div>
                </div>

                <div class="profile-links" id="profile-links">
                    <!-- Links will be injected here -->
                </div>
            </div>
        </aside>

    </div>

    <!-- Mobile Bottom Nav -->
    <nav class="bottom-nav">
        <a href="#/"><i class="fas fa-home"></i></a>
        <a href="#/specs"><i class="fas fa-briefcase"></i></a>
        <a href="#/blog"><i class="fas fa-book"></i></a>
        <a href="#/about"><i class="fas fa-user"></i></a>
    </nav>

    <!-- Scripts -->
    <!-- Marked.js (for rendering Markdown) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Data Files (added for local file support) -->
    <script src="data/profile.js"></script>
    <!-- App Logic -->
    <script src="assets/js/render.js"></script>
    <script src="assets/js/app.js"></script>
</body>

</html>
